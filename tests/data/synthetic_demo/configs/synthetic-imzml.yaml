project:
  name: synthetic-imzml
  output_dir: ../../../../results/synthetic-imzml
  random_seed: 20260912
input:
  imzml: ../synthetic_demo.imzML
  laser_image: ../laser_image.png
  cell_segmentation: ../cell_segmentation.npy
preprocessing:
  backend: python
  normalization: rms
  min_occurrence: 0.0
  peak_tolerance: 10
  tolerance_unit: da
laser_segmentation:
  method: simulated
  radius: 1
  expected_rows: 32
  parameters:
    grid_simulation: full_grid
registration:
  orientation: identity
  edge_policy: error
quantification:
  method: specificity_filtered
  boundary_margin: 0
  unique_min_overlap: 0.0
  dominant_min_overlap: 0.6
  secondary_max_overlap: 0.15
analysis:
  cosg:
    enabled: false
  cnmf:
    enabled: false
qc:
  enabled: false
annotation:
  enabled: false
clustering:
  enabled: false
trajectory:
  enabled: false
